<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>/studio+ / Six Series</title>
<style>
:root{--ink:#050706;--paper:#f5f2ec;--muted:rgba(245,242,236,.63);--accent:#765fe4;--ease:cubic-bezier(.18,.86,.2,1)}*{box-sizing:border-box}html{background:var(--ink);scroll-behavior:smooth}body{margin:0;background:var(--ink);color:var(--paper);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}button,a{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}a{text-decoration:none}[hidden]{display:none!important}.topbar{position:fixed;z-index:20;inset:0 0 auto;padding:18px 2.5vw;display:flex;align-items:center;justify-content:space-between}.mark{font-size:31px;letter-spacing:-.08em}.mark b{color:var(--accent);font-weight:400}.nav-meta{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.contact{border:1px solid rgba(245,242,236,.6);padding:10px 15px;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.contact:hover{background:var(--paper);color:var(--ink)}
.cover{min-height:100svh;display:grid;grid-template-rows:1fr auto;padding:8vh 3.5vw 2.8vh;background:radial-gradient(circle at 50% 44%,rgba(37,87,58,.72),transparent 48%),linear-gradient(180deg,#071009,#06110b 76%,#071b10);position:relative}.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 48%,rgba(255,255,255,.04) 48.1%,transparent 48.35%);pointer-events:none}.cover-stage{position:relative;z-index:1;align-self:center;justify-self:center;width:min(1200px,92vw);aspect-ratio:16/9;display:grid;place-items:center;transform-style:preserve-3d;transition:transform .7s var(--ease),filter .7s ease}.cover-stage::before{content:"";position:absolute;inset:-7%;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.14),transparent 58%);filter:blur(26px);z-index:-1}.cover-stage img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 28px 36px rgba(0,0,0,.35))}.cover-label{position:absolute;z-index:2;left:50%;bottom:-54px;transform:translateX(-50%);text-align:center;white-space:nowrap}.cover-label h1{margin:0 0 8px;font-size:clamp(28px,4vw,62px);font-weight:300;letter-spacing:-.07em}.cover-label p{font-size:11px;color:var(--muted);letter-spacing:.09em;margin:0}.cover-tip{position:absolute;z-index:3;left:50%;bottom:6.5vh;transform:translateX(-50%);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.cover-tip::after{content:"↓";color:var(--accent);margin-left:9px}.collection-grid{position:relative;z-index:4;display:flex;gap:8px;align-items:flex-end;justify-content:center;padding:0 3vw}.collection-card{position:relative;width:clamp(88px,11vw,155px);aspect-ratio:16/9;overflow:hidden;background:#111610;border:1px solid rgba(245,242,236,.18);transition:transform .55s var(--ease),border-color .4s ease,box-shadow .55s ease}.collection-card img{width:100%;height:100%;display:block;object-fit:contain;background:#eee;transition:transform .8s var(--ease)}.collection-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 44%,rgba(0,0,0,.75));pointer-events:none}.collection-card:hover{transform:translateY(-13px) scale(1.08);border-color:var(--accent);box-shadow:0 18px 40px rgba(0,0,0,.45)}.collection-card:hover img{transform:scale(1.04)}.card-index,.card-name{position:absolute;z-index:2;left:9px;font-size:8px;letter-spacing:.12em}.card-index{top:8px;color:rgba(255,255,255,.7)}.card-name{bottom:8px;text-transform:uppercase}.cursor-light{position:fixed;z-index:0;width:260px;height:260px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.1),transparent 68%);transform:translate(-50%,-50%);mix-blend-mode:screen;opacity:0;transition:opacity .4s ease}
.series-viewer{min-height:100svh;background:var(--ink)}.series-hero{min-height:100svh;padding:10vh 4vw 14vh;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 48%),linear-gradient(180deg,#071009,#0a2517 84%);overflow:hidden}.series-hero::before{content:"";position:absolute;inset:-20%;background:radial-gradient(ellipse at 50% 80%,color-mix(in srgb,var(--accent) 25%,transparent),transparent 44%);filter:blur(36px)}.series-num{position:absolute;z-index:2;top:12%;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.2em;color:var(--muted)}.series-side{position:absolute;z-index:2;top:45%;font-size:10px;line-height:1.3;max-width:120px}.series-side.left{left:7vw;text-align:right}.series-side.right{right:7vw}.series-side b{display:block;color:var(--paper);font-size:11px;margin-bottom:5px}.series-side span{color:var(--muted)}.series-image-wrap{position:relative;z-index:1;width:min(86vw,1200px);aspect-ratio:16/9;display:grid;place-items:center}.series-image-wrap img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 30px 42px rgba(0,0,0,.42));transition:opacity .55s ease,transform .8s var(--ease)}.series-caption{position:absolute;z-index:3;bottom:16%;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}.series-caption h1{font-size:clamp(40px,6vw,92px);font-weight:300;letter-spacing:-.08em;line-height:.86;margin:0 0 12px}.series-caption p{font-size:12px;color:var(--muted);margin:0}.frame-progress{position:absolute;z-index:3;bottom:7%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:.15em;color:var(--muted)}.progress-line{width:120px;height:1px;background:rgba(255,255,255,.25);position:relative}.progress-line i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s ease}.frame-controls{position:absolute;z-index:4;right:4vw;bottom:7%;display:flex;gap:8px}.frame-btn{width:38px;height:38px;border:1px solid rgba(255,255,255,.4);border-radius:50%;font-size:18px}.frame-btn:hover{background:var(--paper);color:var(--ink)}.frame-label{position:absolute;z-index:3;top:18%;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.info-section{background:var(--paper);color:#111;padding:16vh 8vw;min-height:80vh;display:grid;grid-template-columns:.8fr 1.2fr;gap:7vw;align-items:center}.info-section h2{font-size:clamp(44px,7vw,105px);font-weight:300;line-height:.82;letter-spacing:-.08em;margin:0}.info-section h2 em{font-family:Georgia,serif}.info-section p{color:#5e625b;font-size:14px;line-height:1.6;max-width:320px}.info-frames{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info-frames figure{margin:0;aspect-ratio:16/9;background:#e3e5df}.info-frames img{width:100%;height:100%;object-fit:contain}.film-drawer{background:var(--ink);color:var(--paper);padding:16vh 8vw 18vh;min-height:90vh}.film-drawer h2{font-size:clamp(48px,7vw,105px);font-weight:300;line-height:.82;letter-spacing:-.08em;margin:0 0 10vh}.film-drawer h2 em{font-family:Georgia,serif}.film-shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:.4fr 1fr;gap:6vw;align-items:center}.film-shell small{display:block;color:var(--accent);font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:16px}.film-shell h3{font-size:clamp(28px,4vw,60px);font-weight:300;line-height:.86;letter-spacing:-.07em;margin:0 0 18px}.film-shell p{color:var(--muted);font-size:14px;line-height:1.55;max-width:270px}.film-shell video{width:100%;height:64vh;object-fit:contain;background:#101710;display:block}.buy-cta{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:13px 16px;background:var(--accent);color:#fff;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.buy-cta:hover{filter:brightness(1.13);transform:translateY(-2px)}.back-home{position:fixed;z-index:30;top:18px;left:2.5vw;display:none;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.viewer-mode .back-home{display:block}.viewer-mode .mark{opacity:0}.viewer-mode .nav-meta,.viewer-mode .contact{display:none}
 .cover-label,.cover-tip{display:none}@media (max-width:800px){.topbar{padding:16px 5vw}.mark{font-size:26px}.nav-meta{display:none}.contact{padding:9px 11px;font-size:9px}.cover{padding:10vh 5vw 4vh}.cover-stage{width:100%;aspect-ratio:16/9}.cover-label{bottom:-40px}.cover-label h1{font-size:28px}.cover-label p{font-size:9px}.cover-tip{bottom:21vh;font-size:8px}.collection-grid{gap:5px;flex-wrap:wrap;padding:0}.collection-card{width:29vw}.card-index,.card-name{font-size:7px;left:6px}.card-index{top:6px}.card-name{bottom:6px}.series-hero{padding:10vh 4vw 16vh}.series-image-wrap{width:100%;aspect-ratio:16/9}.series-side{top:auto;bottom:27%;font-size:8px}.series-side.left{left:5vw;text-align:left}.series-side.right{right:5vw}.series-caption{bottom:14%;white-space:normal;width:90vw}.series-caption h1{font-size:13vw}.series-caption p{font-size:10px}.frame-progress{bottom:7%;font-size:8px}.progress-line{width:72px}.frame-controls{right:5vw;bottom:6%;}.frame-btn{width:32px;height:32px;font-size:15px}.info-section{grid-template-columns:1fr;gap:42px;padding:14vh 8vw}.info-section h2,.film-drawer h2{font-size:17vw}.info-frames{gap:7px}.film-drawer{padding:14vh 8vw}.film-shell{grid-template-columns:1fr;gap:30px}.film-shell video{height:48vh}.buy-cta{margin-top:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cover-stage,.collection-card,.collection-card img,.series-image-wrap img,.buy-cta{transition:none}}
</style></head>
<body>
<header class="topbar"><a class="mark" href="#top">/studio<b>+</b></a><span class="nav-meta">Six product series / 2026</span><a class="contact" href="mailto:studio@example.com">Contact</a></header><button class="back-home" id="backHome" type="button">← All series</button><div class="cursor-light" id="cursorLight"></div>
<main id="home" class="cover"><div class="cover-stage" id="coverStage"><img id="coverImage" src="assets/aurora-p/01.png" alt="AURORA-P original frame"><div class="cover-label"><h1 id="coverTitle">AURORA-P</h1><p id="coverSub">Selected product series / 01</p></div></div><div class="cover-tip">Double-click a series to enter</div><div class="collection-grid" id="collectionGrid"></div></main>
<main id="viewer" class="series-viewer" hidden><section class="series-hero" id="seriesHero"><div class="series-num" id="seriesNum"></div><div class="series-side left"><b id="seriesCategory"></b><span>Original frame<br>kept intact</span></div><div class="series-side right"><b id="seriesShort"></b><span>01 → 08<br>in sequence</span></div><div class="frame-label">Frame / <span id="frameLabel">01</span></div><div class="series-image-wrap"><img id="seriesImage" src="" alt=""></div><div class="series-caption"><h1 id="seriesTitle"></h1><p id="seriesStory"></p></div><div class="frame-progress"><span id="frameCount">01 / 08</span><span class="progress-line"><i id="progressBar"></i></span><span>Scroll</span></div><div class="frame-controls"><button class="frame-btn" id="prevFrame" type="button" aria-label="Previous frame">←</button><button class="frame-btn" id="nextFrame" type="button" aria-label="Next frame">→</button></div></section><section class="info-section"><div><p class="detail-kicker">Series / Detail study</p><h2>Every frame<br>has a <em>reason.</em></h2><p id="infoStory"></p><a class="buy-cta" id="buyCta" href="mailto:studio@example.com">Enquire about this product ↗</a></div><div class="info-frames" id="infoFrames"></div></section><section class="film-drawer" id="film-drawer"><h2>See it<br><em>move.</em></h2><div class="film-shell"><div><small id="filmIndex"></small><h3 id="filmTitle"></h3><p id="filmText"></p></div><video id="seriesVideo" controls muted playsinline preload="metadata"></video></div></section></main>
<script>
const products=[
{id:'aurora-p',name:'AURORA-P',category:'Wireless audio',short:'Pure sound.',story:'A compact violet earbud system built for everyday freedom.',accent:'#6d5be1',images:['assets/aurora-p/01.png','assets/aurora-p/02.png','assets/aurora-p/03.png','assets/aurora-p/04.png','assets/aurora-p/05.png','assets/aurora-p/06.png','assets/aurora-p/07.png','assets/aurora-p/08.png'],video:'assets/aurora-p/showreel.mov'},
{id:'ban-ear-plus',name:'BAN EAR+',category:'Wireless audio',short:'See the sound.',story:'A tactile launch system where gloss, grain and skin become one surface.',accent:'#9674ed',images:['assets/ban-ear-plus/01.png','assets/ban-ear-plus/02.png','assets/ban-ear-plus/03.png','assets/ban-ear-plus/04.png','assets/ban-ear-plus/05.png','assets/ban-ear-plus/06.png','assets/ban-ear-plus/07.png','assets/ban-ear-plus/08.png','assets/ban-ear-plus/09.png'],video:'assets/ban-ear-plus/showreel.mov'},
{id:'k-rooxs',name:'K-ROOXS',category:'Beauty tech',short:'Beauty, made personal.',story:'Warm neutrals and precise detail turn a device into a repeatable ritual.',accent:'#e47a50',images:['assets/k-rooxs/01.png','assets/k-rooxs/02.png','assets/k-rooxs/03.png','assets/k-rooxs/04.png','assets/k-rooxs/05.png','assets/k-rooxs/06.png','assets/k-rooxs/07.png','assets/k-rooxs/08.png'],video:'assets/k-rooxs/showreel.mov'},
{id:'rgb-crystal-lamp',name:'RGB CRYSTAL',category:'Ambient light',short:'Light up space.',story:'A crystal-textured lamp translated into four moods and one clear system.',accent:'#f3a25f',images:['assets/rgb-crystal-lamp/01.png','assets/rgb-crystal-lamp/02.png','assets/rgb-crystal-lamp/03.png','assets/rgb-crystal-lamp/04.png','assets/rgb-crystal-lamp/05.png','assets/rgb-crystal-lamp/06.png','assets/rgb-crystal-lamp/07.png','assets/rgb-crystal-lamp/08.png','assets/rgb-crystal-lamp/09.png'],video:'assets/rgb-crystal-lamp/showreel.mov'},
{id:'vidda-c1-pro',name:'VIDDA C1 PRO',category:'Home cinema',short:'Cinema, reimagined.',story:'A quiet room, a precise lens and the rush of motion in contrast.',accent:'#ff624e',images:['assets/vidda-c1-pro/01.png','assets/vidda-c1-pro/02.png','assets/vidda-c1-pro/03.png','assets/vidda-c1-pro/04.png','assets/vidda-c1-pro/05.png','assets/vidda-c1-pro/06.png','assets/vidda-c1-pro/07.png','assets/vidda-c1-pro/08.png'],video:'assets/vidda-c1-pro/showreel.mov'},
{id:'xiaomi-camera',name:'SMART CAMERA 4C',category:'Home security',short:'Clarity is the first layer.',story:'Lens detail, reliable connection and the life it protects.',accent:'#f07a25',images:['assets/xiaomi-camera/01.png','assets/xiaomi-camera/02.png','assets/xiaomi-camera/03.png','assets/xiaomi-camera/04.png','assets/xiaomi-camera/05.png','assets/xiaomi-camera/06.png','assets/xiaomi-camera/07.png','assets/xiaomi-camera/08.png','assets/xiaomi-camera/09.png','assets/xiaomi-camera/10.png'],video:'assets/xiaomi-camera/showreel.mov'}];
const home=document.getElementById('home'),viewer=document.getElementById('viewer'),grid=document.getElementById('collectionGrid'),coverStage=document.getElementById('coverStage');let current=0,frame=0,timer;
products.forEach((p,i)=>{const card=document.createElement('button');card.className='collection-card';card.type='button';card.dataset.index=i;card.innerHTML=`<span class="card-index">${String(i+1).padStart(2,'0')} / 06</span><img src="${p.images[0]}" alt="${p.name} original frame"><span class="card-name">${p.name}</span>`;card.addEventListener('mouseenter',()=>{document.getElementById('coverImage').src=p.images[0];document.getElementById('coverTitle').textContent=p.name;document.getElementById('coverSub').textContent=p.category+' / '+String(i+1).padStart(2,'0')});card.addEventListener('dblclick',()=>openSeries(i));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSeries(i)}});grid.appendChild(card)});
function renderFrame(){const p=products[current];const image=document.getElementById('seriesImage');image.style.opacity='0';setTimeout(()=>{image.src=p.images[frame];image.alt=p.name+' frame '+(frame+1);image.style.opacity='1'},180);document.getElementById('frameLabel').textContent=String(frame+1).padStart(2,'0');document.getElementById('frameCount').textContent=String(frame+1).padStart(2,'0')+' / '+String(p.images.length).padStart(2,'0');document.getElementById('progressBar').style.width=((frame+1)/p.images.length*100)+'%'}
function startSequence(){clearInterval(timer);timer=setInterval(()=>{frame=(frame+1)%products[current].images.length;renderFrame()},4200)}function openSeries(index){current=index;frame=0;const p=products[index];home.hidden=true;viewer.hidden=false;document.body.classList.add('viewer-mode');document.documentElement.style.setProperty('--accent',p.accent);document.documentElement.style.setProperty('--series-accent',p.accent);document.getElementById('seriesNum').textContent=String(index+1).padStart(2,'0')+' / 06';document.getElementById('seriesCategory').textContent=p.category;document.getElementById('seriesShort').textContent=p.short;document.getElementById('seriesTitle').textContent=p.name;document.getElementById('seriesStory').textContent=p.story;document.getElementById('infoStory').textContent=p.story;document.getElementById('infoFrames').innerHTML=p.images.slice(1,3).map((src,i)=>`<figure><img src="${src}" alt="${p.name} detail ${i+2}"></figure>`).join('');document.getElementById('filmIndex').textContent=String(index+1).padStart(2,'0')+' / motion study';document.getElementById('filmTitle').textContent=p.name;document.getElementById('filmText').textContent=p.story;document.getElementById('seriesVideo').src=p.video;document.getElementById('buyCta').href='mailto:studio@example.com?subject='+encodeURIComponent('Enquire about '+p.name);renderFrame();startSequence();viewer.scrollIntoView({behavior:'smooth',block:'start'})}
function closeSeries(){clearInterval(timer);document.getElementById('seriesVideo').pause();document.getElementById('seriesVideo').removeAttribute('src');viewer.hidden=true;home.hidden=false;document.body.classList.remove('viewer-mode');home.scrollIntoView({behavior:'smooth',block:'start'})}function moveFrame(delta){frame=(frame+delta+products[current].images.length)%products[current].images.length;renderFrame();startSequence()}document.getElementById('backHome').addEventListener('click',closeSeries);document.getElementById('prevFrame').addEventListener('click',()=>moveFrame(-1));document.getElementById('nextFrame').addEventListener('click',()=>moveFrame(1));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!viewer.hidden)closeSeries();if(!viewer.hidden&&e.key==='ArrowRight')moveFrame(1);if(!viewer.hidden&&e.key==='ArrowLeft')moveFrame(-1)});document.addEventListener('pointermove',e=>{const light=document.getElementById('cursorLight');light.style.left=e.clientX+'px';light.style.top=e.clientY+'px';light.style.opacity='1';if(!viewer.hidden)return;coverStage.style.transform='perspective(900px) rotateX('+((e.clientY-innerHeight/2)/-80)+'deg) rotateY('+((e.clientX-innerWidth/2)/100)+'deg)'});document.addEventListener('pointerleave',()=>{coverStage.style.transform='none'});
</script></body></html>
